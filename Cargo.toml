[package]
name = "sqd-query-engine"
version = "0.1.0"
edition = "2021"
# benches/{queries,legacy}.rs are shared modules included via #[path], not
# standalone bench targets. Disable autodiscovery and list benches explicitly.
autobenches = false

[dependencies]
arrow = { version = "54", features = ["ffi", "ipc_compression"] }
parquet = { version = "54", features = ["arrow"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
anyhow = "1"
itoa = "1"
memmap2 = "0.9"
bytes = "1"
faster-hex = "0.10"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
ryu = "1.0.23"
rustc-hash = "2"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[features]
default = []
legacy-query = ["dep:sqd-query"]

[dependencies.sqd-query]
path = "../data/crates/query"
optional = true
features = ["parquet"]

[[bin]]
name = "generate_fixtures"
required-features = ["legacy-query"]

[dev-dependencies]
# arrow/parquet repeated so integration tests can build synthetic chunks
arrow = { version = "54", features = ["ffi", "ipc_compression"] }
parquet = { version = "54", features = ["arrow"] }
divan = "0.1"
paste = "1.0.15"
tempfile = "3"
proptest = "1"
zstd = "0.13"

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "profile"
harness = false

[[bench]]
name = "memory"
harness = false
