# Every real chunk a test or bench reads, once, by name. `ref` says where the
# chunk is: `s3://<dataset id>/<chunk path>` in the chunk store, or
# `fixture:<dataset>` for a chunk only the legacy repo's fixture tree holds. A
# stored chunk also gives the XXH3-128 of each of its files, which `make fetch`
# checks. A query directory's own `chunks.yaml` names the chunks its queries run
# on. See tests/queries/README.md.

# The bench chunks: 224 blocks of Ethereum, 1592 older blocks of Ethereum, and
# 48 blocks of Solana.
evm-small:
  ref: s3://ethereum-mainnet-2/0024541717/0024550597-0024550820-4292c586
  xxh3:
