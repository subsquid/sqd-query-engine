name: hyperliquidReplicaCmds

tables:
  blocks:
    output:
      name: block
      fields: [ number, hash, parent_hash, round, parent_round, proposer, timestamp, hardfork ]
    parent_hash_column: parent_hash
    block_number_column: number
    sort_key: [ number ]
    columns:
      number:
        type: uint64
      hash:
        type: string
      parent_hash:
        type: string
      round:
        type: uint64
      parent_round:
        type: uint64
      proposer:
        type: string
      timestamp:
        type: timestamp_millisecond
        encoding: timestamp_millisecond
      hardfork:
        type: string
        encoding: json_verbatim

  actions:
    request:
      name: actions
      filters: [ action_type, user, vault_address, status ]
    output:
      name: action
      fields: [ action_index, user, action, signature, nonce, vault_address, status, response ]
    item_order_keys: [ action_index ]
    sort_key: [ action_type, user, vault_address, block_number, action_index ]
    columns:
      block_number:
        type: uint64
      action_index:
        type: uint32
      user:
        type: string
      action_type:
        type: string
      action:
        type: string
        encoding: json_verbatim
        weight: action_size
      action_size:
        type: uint64
        system: true
      signature:
        type: string
        encoding: json_verbatim
      nonce:
        type: uint64
      vault_address:
        type: string
      status:
        type: string
      response:
        type: string
        encoding: json_verbatim
        weight: response_size
      response_size:
        type: uint64
        system: true
      # Extracted nested list columns for efficient filtering
      order_asset:
        type: list_uint32
        system: true
      order_cloid:
        type: list_string
        system: true
      cancel_asset:
        type: list_uint32
        system: true
      cancel_by_cloid_asset:
        type: list_uint32
        system: true
      cancel_by_cloid_cloid:
        type: list_string
        system: true
      batch_modify_asset:
        type: list_uint32
        system: true
      batch_modify_cloid:
        type: list_string
        system: true

aliases:
  orderActions:
    table: actions
    implicit_filters:
      action_type: [ "order" ]
    filters: [ user, vault_address, status, contains_asset, contains_cloid ]
    special_filters:
      contains_asset: { kind: column_alias, column: order_asset }
      contains_cloid: { kind: column_alias, column: order_cloid }

  cancelActions:
    table: actions
    implicit_filters:
      action_type: [ "cancel" ]
    filters: [ user, vault_address, status, contains_asset ]
    special_filters:
      contains_asset: { kind: column_alias, column: cancel_asset }

  cancelByCloidActions:
    table: actions
    implicit_filters:
      action_type: [ "cancelByCloid" ]
    filters: [ user, vault_address, status, contains_asset, contains_cloid ]
    special_filters:
      contains_asset: { kind: column_alias, column: cancel_by_cloid_asset }
      contains_cloid: { kind: column_alias, column: cancel_by_cloid_cloid }

  batchModifyActions:
    table: actions
    implicit_filters:
      action_type: [ "batchModify" ]
    filters: [ user, vault_address, status, contains_asset, contains_cloid ]
    special_filters:
      contains_asset: { kind: column_alias, column: batch_modify_asset }
      contains_cloid: { kind: column_alias, column: batch_modify_cloid }
