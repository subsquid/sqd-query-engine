name: tron

# Tron writes hex without the `0x` prefix, so its addresses, topics and sighashes
# are plain strings on the way out. `fold_case` is what carries the other half of
# `hexBytes` — a case-insensitive comparison — and is declared on the columns a
# filter can reach.

tables:
  blocks:
    output:
      name: block
      fields: [
        number, hash, parent_hash, tx_trie_root, version, timestamp, witness_address,
        witness_signature
      ]
    parent_hash_column: parent_hash
    block_number_column: number
    sort_key: [ number ]
    columns:
      number:
        type: uint64
      hash:
        type: string
      parent_hash:
        type: string
      tx_trie_root:
        type: string
      version:
        type: int32
      timestamp:
        type: timestamp_millisecond
        encoding: timestamp_millisecond
      witness_address:
        type: string
      witness_signature:
        type: string

  transactions:
    request:
      name: transactions
      filters: [ type ]
      relations:
        logs:
          table: logs
          key: [ block_number, transaction_index ]
        internal_transactions:
          table: internal_transactions
          key: [ block_number, transaction_index ]
    output:
      name: transaction
      fields: [
        transaction_index, hash, ret, signature, type, parameter, permission_id, ref_block_bytes,
        ref_block_hash, fee_limit, expiration, timestamp, raw_data_hex, fee, contract_result,
        contract_address, res_message, withdraw_amount, unfreeze_amount, withdraw_expire_amount,
        cancel_unfreeze_v2_amount, result, energy_fee, energy_usage, energy_usage_total, net_usage,
        net_fee, origin_energy_usage, energy_penalty_total
      ]
    item_order_keys: [ transaction_index ]
    sort_key: [
      type, _trigger_smart_contract_sighash, _trigger_smart_contract_contract,
      _trigger_smart_contract_owner, _transfer_contract_owner, _transfer_contract_to,
      _transfer_asset_contract_owner, _transfer_asset_contract_to,
      _transfer_asset_contract_asset, block_number, transaction_index
    ]
    columns:
      block_number:
        type: uint64
      transaction_index:
        type: uint32
      hash:
        type: string
      ret:
        type: string
        encoding: json_verbatim
      signature:
        type: list_string
      type:
        type: string
      parameter:
        type: string
        encoding: json_verbatim
      permission_id:
        type: int32
      ref_block_bytes:
        type: string
      ref_block_hash:
        type: string
      fee_limit:
        type: int64
        encoding: decimal_string
      expiration:
        type: timestamp_millisecond
        encoding: timestamp_millisecond
      timestamp:
        type: timestamp_millisecond
        encoding: timestamp_millisecond
      raw_data_hex:
        type: string
        weight: raw_data_hex_size
      fee:
        type: int64
        encoding: decimal_string
      contract_result:
        type: string
      contract_address:
        type: string
      res_message:
        type: string
      withdraw_amount:
        type: int64
        encoding: decimal_string
      unfreeze_amount:
        type: int64
        encoding: decimal_string
      withdraw_expire_amount:
        type: int64
        encoding: decimal_string
      cancel_unfreeze_v2_amount:
        type: string
        encoding: json_verbatim
      result:
        type: string
      energy_fee:
        type: int64
        encoding: decimal_string
      energy_usage:
        type: int64
        encoding: decimal_string
      energy_usage_total:
        type: int64
        encoding: decimal_string
      net_usage:
        type: int64
        encoding: decimal_string
      net_fee:
        type: int64
        encoding: decimal_string
      origin_energy_usage:
        type: int64
        encoding: decimal_string
      energy_penalty_total:
        type: int64
        encoding: decimal_string
      # Per-contract extractions, reachable only through the three aliases.
      _transfer_contract_owner:
        type: string
        fold_case: true
        system: true
      _transfer_contract_to:
        type: string
        fold_case: true
        system: true
      _transfer_asset_contract_owner:
        type: string
        fold_case: true
        system: true
      _transfer_asset_contract_to:
        type: string
        fold_case: true
        system: true
      # An asset name, not an address: the reference compares it byte-exactly.
      _transfer_asset_contract_asset:
        type: string
        system: true
      _trigger_smart_contract_owner:
        type: string
        fold_case: true
        system: true
      _trigger_smart_contract_contract:
        type: string
        fold_case: true
        system: true
      _trigger_smart_contract_sighash:
        type: string
        fold_case: true
        system: true
      # system
      raw_data_hex_size:
        type: uint64
        system: true

  logs:
    request:
      name: logs
      filters: [ address, topic0, topic1, topic2, topic3 ]
      relations:
        transaction:
          table: transactions
          key: [ block_number, transaction_index ]
    output:
      name: log
      fields: [ transaction_index, log_index, address, data, topics ]
      virtual_fields:
        topics:
          kind: roll
          columns: [ topic0, topic1, topic2, topic3 ]
    item_order_keys: [ transaction_index, log_index ]
    sort_key: [ topic0, address, block_number, transaction_index, log_index ]
    columns:
      block_number:
        type: uint64
      log_index:
        type: uint32
      transaction_index:
        type: uint32
      address:
        type: string
        fold_case: true
      data:
        type: string
        weight: data_size
      topic0:
        type: string
        fold_case: true
      topic1:
        type: string
        fold_case: true
      topic2:
        type: string
        fold_case: true
      topic3:
        type: string
        fold_case: true
      # system
      data_size:
        type: uint64
        system: true

  internal_transactions:
    request:
      name: internalTransactions
      filters: [ caller, transfer_to ]
      special_filters:
        # Both filters are named for the party, the columns for the address.
        caller:
          kind: column_alias
          column: caller_address
        transfer_to:
          kind: column_alias
          column: transfer_to_address
      relations:
        transaction:
          table: transactions
          key: [ block_number, transaction_index ]
    output:
      name: internalTransaction
      fields: [
        transaction_index, internal_transaction_index, hash, caller_address, transfer_to_address,
        call_value_info, note, rejected, extra
      ]
    item_order_keys: [ transaction_index, internal_transaction_index ]
    sort_key: [
      transfer_to_address, caller_address, block_number, transaction_index,
      internal_transaction_index
    ]
    columns:
      block_number:
        type: uint64
      transaction_index:
        type: uint32
      internal_transaction_index:
        type: uint32
      hash:
        type: string
      caller_address:
        type: string
        fold_case: true
      transfer_to_address:
        type: string
        fold_case: true
      call_value_info:
        type: string
        encoding: json_verbatim
      note:
        type: string
      rejected:
        type: boolean
      # Written by the same builder as `call_value_info`, but appended raw: the
      # model types it `Option<HexBytes>`, so it is a bare hex string, not JSON.
      extra:
        type: string

aliases:
  transferTransactions:
    table: transactions
    implicit_filters:
      type: [ "TransferContract" ]
    filters: [ owner, to ]
    special_filters:
      owner: { kind: column_alias, column: _transfer_contract_owner }
      to: { kind: column_alias, column: _transfer_contract_to }
    relations:
      logs:
        table: logs
        key: [ block_number, transaction_index ]
      internal_transactions:
        table: internal_transactions
        key: [ block_number, transaction_index ]

  transferAssetTransactions:
    table: transactions
    implicit_filters:
      type: [ "TransferAssetContract" ]
    filters: [ owner, to, asset ]
    special_filters:
      owner: { kind: column_alias, column: _transfer_asset_contract_owner }
      to: { kind: column_alias, column: _transfer_asset_contract_to }
      asset: { kind: column_alias, column: _transfer_asset_contract_asset }
    relations:
      logs:
        table: logs
        key: [ block_number, transaction_index ]
      internal_transactions:
        table: internal_transactions
        key: [ block_number, transaction_index ]

  triggerSmartContractTransactions:
    table: transactions
    implicit_filters:
      type: [ "TriggerSmartContract" ]
    filters: [ owner, contract, sighash ]
    special_filters:
      owner: { kind: column_alias, column: _trigger_smart_contract_owner }
      contract: { kind: column_alias, column: _trigger_smart_contract_contract }
      sighash: { kind: column_alias, column: _trigger_smart_contract_sighash }
    relations:
      logs:
        table: logs
        key: [ block_number, transaction_index ]
      internal_transactions:
        table: internal_transactions
        key: [ block_number, transaction_index ]
